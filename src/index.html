<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--CSP-->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1418" />
  <meta name="color-scheme" content="dark" />
  <title>TraiLilo: Patagonia</title>
  <meta name="description" content="TraiLilo, our adventure journal." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="app.css" />
  <!-- shown at once, before anything downloads; the app replaces it -->
  <style>
    html, body { margin: 0; background: #0B1418; }
    .boot { min-height: 100dvh; display: grid; place-content: center; gap: 10px; text-align: center; color: #9fb3ba; font: 15px system-ui, sans-serif; }
    .boot b { font-size: 34px; letter-spacing: 0.04em; color: #fff; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="root"><div class="boot" role="status"><b>TraiLilo</b><span>Opening your journal…</span></div></div>
  <script type="module" src="app.js"></script>

</html>
